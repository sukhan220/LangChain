[project]
name = "langchain-learn"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Shahab", email = "shahabuddink220@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "ipykernel>=7.4.0",
    "langchain>=1.5.1",
    "langchain-community>=0.4.2",
    "langchain-core>=1.8.3",
    "langchain-google-genai>=4.5.0",
    "langchain-groq>=1.2.1",
    "langchain-openai>=1.8.2",
    "pymupdf>=2.1",
    "pypdf>=7.1.1",
    "python-dotenv>=1.2.4",
]

[project.scripts]
langchain = "langchain:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
